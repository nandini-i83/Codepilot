<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodePilot AI Tutor</title>
<style>
:root{--bg:#0b1014;--card:#141e26;--line:#26343f;--tx:#f1efd0;--mu:#8fa3b0;--pu:#a78bfa;--te:#2dd4bf;--gr:#4ade80;--or:#fb923c;--ye:#facc15}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1b2a35,var(--bg) 55%);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,sans-serif;min-height:100vh}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 24px}
.logo{font-weight:800;font-size:20px}.logo b{color:var(--pu)}.badge{font-size:11px;background:#123;color:var(--te);padding:2px 8px;border-radius:9px;margin-left:6px}
nav{display:flex;gap:4px;background:#0e161c;border:1px solid var(--line);border-radius:30px;padding:4px}
nav button{background:none;border:0;padding:8px 16px;border-radius:24px;color:var(--mu)}nav button.on{background:linear-gradient(90deg,#c4b5fd,#a5b4fc);color:#1a1033;font-weight:700}
.rt{display:flex;gap:8px;align-items:center}.pill{background:#0e161c;border:1px solid var(--line);border-radius:20px;padding:6px 12px}
.streak{color:var(--or);border-color:#7c4a1e;background:#2a1b0e}
main{padding:8px 24px 60px;max-width:1200px;margin:auto}
h1{font-size:44px;line-height:1.1;margin:10px 0}h1 span{background:linear-gradient(90deg,#a78bfa,#2dd4bf);-webkit-background-clip:text;color:transparent}
h2{margin:28px 0 4px}.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.btn{background:linear-gradient(90deg,#a78bfa,#2dd4bf);color:#10122a;border:0;border-radius:12px;padding:10px 18px;font-weight:700}
.btn2{background:#16222b;border:1px solid var(--line);border-radius:12px;padding:10px 16px}
.tile{cursor:pointer;transition:.15s}.tile:hover,.tile.on{border-color:var(--pu);transform:translateY(-2px)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center}
pre,code{font-family:Consolas,monospace}pre{background:#0a1015;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;margin:6px 0;white-space:pre-wrap}
.bar{height:6px;background:#0c1319;border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pu),var(--te))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.lv{font-size:12px;padding:2px 10px;border-radius:12px;border:1px solid}.Beginner{color:var(--gr)}.Intermediate{color:var(--ye)}.Advanced{color:#f87171}
.tut{display:grid;grid-template-columns:1fr 1fr;gap:16px}
textarea{width:100%;min-height:230px;background:#0a1015;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:Consolas,monospace;font-size:13px;resize:vertical}
.chat{height:440px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:6px}
.m{max-width:92%;padding:10px 12px;border-radius:12px;background:#1a2933;white-space:pre-wrap;word-break:break-word}.m.u{align-self:flex-end;background:linear-gradient(90deg,#7c6cf0,#3aa6a0)}
.in{display:flex;gap:8px;margin-top:8px}.in input{flex:1;background:#0a1015;border:1px solid var(--line);border-radius:10px;padding:10px}
select{background:#0e161c;border:1px solid var(--line);border-radius:20px;padding:6px 10px}
.day{text-align:center;padding:12px;border-radius:12px;border:1px solid #444;color:var(--mu)}.day.a{border-color:#a5682a;background:#2a1b0e;color:var(--or)}
#modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:9}#modal.s{display:grid}
#modal .card{width:min(440px,92vw)}#modal input{width:100%;margin:6px 0 12px;background:#0a1015;border:1px solid var(--line);border-radius:8px;padding:10px}
input[type=search]{width:100%;padding:12px;border-radius:12px;background:#0e161c;border:1px solid var(--line)}
@media(max-width:820px){.hero,.tut{grid-template-columns:1fr}h1{font-size:32px}}
</style></head><body>
<header>
 <div class="logo">Code<b>Pilot</b><span class="badge">AI TUTOR</span></div>
 <nav id="nav"></nav>
 <div class="rt"><select id="lang"></select><span class="pill streak" id="stk"></span><button class="pill" onclick="modal.classList.add('s')" title="Gemini settings">⚙ Gemini</button></div>
</header>
<main id="v"></main>
<div id="modal"><div class="card"><h3 style="margin:0 0 8px">Gemini settings</h3>
<label class="mu">API key (get one free at aistudio.google.com/apikey)</label><input id="key" type="password" placeholder="AIza...">
<label class="mu">Model</label><input id="mdl" placeholder="gemini-2.5-flash">
<p class="mu" style="font-size:12px">Stored only in this browser. For a shared deployment, call Gemini from a backend instead.</p>
<div class="row"><button class="btn2" onclick="modal.classList.remove('s')">Cancel</button><button class="btn" onclick="saveKey()">Save</button></div></div></div>
<script>
const $=s=>document.querySelector(s),LANGS={python:'Python',javascript:'JavaScript',java:'Java',cpp:'C++',c:'C'};
const TRK={python:'Versatile, readable & great for AI & data science',javascript:'The language of the web & full-stack apps',java:'Robust, object-oriented enterprise backbone',cpp:'High performance systems & game programming',c:'Low-level foundational systems programming'};
const TOPICS=[['Variables','Memory storage, primitives, scoping & type casting'],['Loops','Iteration, for-loops, while-loops & control flow'],['Functions','Modular logic, parameters, returns & recursion'],['Arrays','Contiguous memory, list slicing & linear searches'],['OOP','Classes, encapsulation, inheritance & polymorphism'],['Data Structures','Stacks, queues, hash maps & linked nodes']];
const Q=[
{id:1,t:'Swap Two Variables Without Temp',tp:'Variables',lv:'Beginner',d:'Write a program that takes two integer variables a and b and swaps their values without using a third temporary variable.',i:'a = 5, b = 10',o:'a = 10, b = 5',x:'In Python, tuple unpacking a, b = b, a swaps atomically. Other languages can use arithmetic (a=a+b; b=a-b; a=a-b) or XOR.',s:'def swap_numbers(a, b):\n    # your code here\n    return a, b\n\nprint(swap_numbers(5, 10))'},
{id:2,t:'Print a Pyramid Star Pattern',tp:'Loops',lv:'Beginner',d:'Print a pyramid of stars with n rows (n = 4).',i:'n = 4',o:'   *\n  ***\n *****\n*******',x:'Row i needs (n-i) spaces followed by (2i-1) stars. Nested loops or string multiplication work.',s:'n = 4\nfor i in range(1, n + 1):\n    pass  # print spaces then stars'},
{id:3,t:'Two Sum Problem',tp:'Arrays',lv:'Beginner',d:'Given a list of integers and a target, return the indices of the two numbers that add up to the target.',i:'nums=[2,7,11,15], target=9',o:'[0, 1]',x:'A hash map from value to index gives O(n): for each x, check whether target-x was seen.',s:'def two_sum(nums, target):\n    pass\n\nprint(two_sum([2, 7, 11, 15], 9))'},
{id:4,t:'Factorial with Recursion',tp:'Functions',lv:'Intermediate',d:'Compute n! recursively. Handle the base case.',i:'n = 5',o:'120',x:'Recursion needs a base case (0! = 1) and a step (n * fact(n-1)).',s:'def fact(n):\n    pass\n\nprint(fact(5))'},
{id:5,t:'FizzBuzz',tp:'Loops',lv:'Beginner',d:'Print 1..15. Multiples of 3 print Fizz, of 5 Buzz, of both FizzBuzz.',i:'n = 15',o:'1 2 Fizz 4 Buzz ... FizzBuzz',x:'Check divisibility by 15 (or both 3 and 5) first, then 3, then 5.',s:'for i in range(1, 16):\n    pass'},
{id:6,t:'Valid Parentheses with a Stack',tp:'Data Structures',lv:'Intermediate',d:'Return True if a string of ()[]{} brackets is balanced.',i:'"([]{})"',o:'True',x:'Push openers on a stack; on a closer, the top must be its matching opener.',s:'def valid(s):\n    pass\n\nprint(valid("([]{})"), valid("(]"))'},
{id:7,t:'Bank Account Class',tp:'OOP',lv:'Intermediate',d:'Create a BankAccount class with deposit, withdraw (no overdraft) and a balance property.',i:'deposit 100, withdraw 30',o:'70',x:'Encapsulate balance, validate inside withdraw and raise an error on overdraft.',s:'class BankAccount:\n    pass\n\na = BankAccount()\n'},
{id:8,t:'LRU Cache',tp:'Data Structures',lv:'Advanced',d:'Design an LRU cache with get and put in O(1).',i:'capacity 2',o:'evicts least recently used',x:'Combine a hash map with a doubly linked list, or use OrderedDict in Python.',s:'class LRUCache:\n    def __init__(self, cap):\n        pass\n'}];
const S=JSON.parse(localStorage.cp||'null')||{lang:'python',days:[],solved:[],marks:[1,3],done:0,tab:'home',qid:1,topic:'',lv:'All',chat:{},q:'',key:'',model:'gemini-2.5-flash'};
const save=()=>localStorage.cp=JSON.stringify(S);
const today=()=>new Date().toISOString().slice(0,10);
if(!S.days.includes(today()))S.days.push(today());
const streak=()=>{let n=0,d=new Date();while(S.days.includes(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=s=>esc(s).replace(/```\w*\n?([\s\S]*?)```/g,'<pre>$1</pre>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
const cur=()=>Q.find(q=>q.id==S.qid);
const langsOpt=()=>Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${S.lang==k?'selected':''}>${v}</option>`).join('');
$('#lang').innerHTML=langsOpt();$('#lang').onchange=e=>{S.lang=e.target.value;go(S.tab)};
$('#key').value=S.key;$('#mdl').value=S.model;
function saveKey(){S.key=$('#key').value.trim();S.model=$('#mdl').value.trim()||'gemini-2.5-flash';save();modal.classList.remove('s');toast('Gemini key saved')}
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#123;border:1px solid var(--te);padding:10px 16px;border-radius:10px;z-index:10';document.body.append(d);setTimeout(()=>d.remove(),2200)}

/* ---- Gemini ---- */
async function gemini(msgs,system){
 if(!S.key){modal.classList.add('s');throw new Error('Add your Gemini API key first (⚙ Gemini).')}
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${S.model}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.key},
  body:JSON.stringify({system_instruction:{parts:[{text:system}]},contents:msgs.map(m=>({role:m.r=='u'?'user':'model',parts:[{text:m.t}]}))})});
 const j=await r.json();if(!r.ok)throw new Error(j.error?.message||'Gemini request failed');
 return j.candidates?.[0]?.content?.parts?.map(p=>p.text).join('')||'(no response)'}
const sysPrompt=()=>{const q=cur();return `You are CodePilot, a friendly programming tutor. Language: ${LANGS[S.lang]}. Current problem: "${q.t}" — ${q.d} Sample input: ${q.i}. Expected output: ${q.o}.\nStudent's current code:\n${$('#code')?.value||'(none)'}\nLast console output:\n${$('#out')?.textContent||'(none)'}\nGuide the student with hints before full solutions unless they ask for the answer. Be concise, use short code blocks.`};
async function ask(text,label){
 const c=S.chat[S.qid]=S.chat[S.qid]||[];c.push({r:'u',t:label||text});draw();
 c.push({r:'m',t:'Thinking…'});draw();
 try{const hist=c.slice(0,-1).map((m,i,a)=>i==a.length-1?{r:'u',t:text}:m);c[c.length-1].t=await gemini(hist,sysPrompt())}
 catch(e){c[c.length-1].t='⚠ '+e.message}
 save();draw()}
function draw(){const b=$('#chat');if(!b)return;const c=S.chat[S.qid]||[];
 b.innerHTML=c.length?c.map(m=>`<div class="m ${m.r}">${md(m.t)}</div>`).join(''):`<div class="m">Hi! I'm your Gemini-powered tutor for <b>${esc(cur().t)}</b>. Ask a question, request a hint, or run your code and I'll review it.</div>`;b.scrollTop=1e9}

/* ---- Code runner ---- */
let pyo;
async function run(){
 const o=$('#out'),code=$('#code').value;o.textContent='Running…';let out='',err=false;
 try{
  if(S.lang=='python'){
   if(!pyo){if(!window.loadPyodide){await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';s.onload=ok;s.onerror=()=>no(new Error('Could not load Python runtime (offline?)'));document.head.append(s)})}o.textContent='Loading Python runtime…';pyo=await loadPyodide()}
   const buf=[];pyo.setStdout({batched:t=>buf.push(t)});pyo.setStderr({batched:t=>buf.push(t)});
   await pyo.runPythonAsync(code);out=buf.join('\n')||'(no output)'}
  else if(S.lang=='javascript'){const buf=[];const f=a=>buf.push(a.map(x=>typeof x=='object'?JSON.stringify(x):String(x)).join(' '));
   new Function('console',code)({log:(...a)=>f(a),error:(...a)=>f(a)});out=buf.join('\n')||'(no output)'}
  else{out=await gemini([{r:'u',t:code}],`Act as a ${LANGS[S.lang]} compiler and runtime. Output ONLY the exact program output, or the compiler error message. No commentary, no markdown.`);out='[simulated by Gemini]\n'+out}
 }catch(e){err=true;out=String(e.message||e)}
 o.textContent=out;
 if(!err){if(!S.solved.includes(S.qid)){S.solved.push(S.qid);S.done=Math.min(24,S.done+1)}save();
  ask(`I ran my code and got this output:\n${out}\nBriefly tell me if it solves the problem and one improvement.`,'▶ Ran my code — review it')}
 else{save();ask(`My code raised this error:\n${out}\nExplain what's wrong without giving the full answer.`,'▶ Ran my code — got an error')}}

/* ---- Views ---- */
const views={
home(){const q=cur();return `<div class="hero"><div><span class="pill" style="color:var(--te);font-size:13px">Next-Gen AI Programming Mentor</span>
<h1>Code with Clarity.<br>Guided by <span>Adaptive AI.</span></h1>
<p class="mu">Interactive coding exercises, line-by-line explanations from Gemini, and multi-language problem solving.</p>
<button class="btn" onclick="go('tutor')">▶ Start Learning</button> <button class="btn2" onclick="go('practice')">Browse Practice Library</button></div>
<div class="card"><div class="row mu"><span>codepilot_agent.py</span><span class="pill" style="color:var(--gr)">Live Session</span></div>
<pre style="color:#d8f3dc">async def ai_tutor_loop(user):\n    gap = await analyze_code(user.submission)\n    if gap:\n        return tutor.explain_concept(\n            difficulty="adaptive", provide_hint=True)\n    return "Perfect solution!"</pre>
<div class="card" style="background:#101a22">CodePilot AI: "You have solved ${S.solved.length} of ${Q.length} practice problems."</div></div></div>
<div class="row"><h2>Programming Language Tracks</h2><span class="pill" style="color:var(--te)">Active: ${LANGS[S.lang]}</span></div>
<div class="grid">${Object.entries(LANGS).map(([k,v])=>`<div class="card tile ${S.lang==k?'on':''}" onclick="S.lang='${k}';$('#lang').value='${k}';save();go('home')"><h3>${v} ${S.lang==k?'✓':''}</h3><p class="mu">${TRK[k]}</p><small class="mu">6 Practice Modules</small></div>`).join('')}</div>
<div class="row"><h2>Your Learning Velocity</h2><button class="btn2" onclick="go('progress')">View Full Analytics →</button></div>
<div class="grid">${stats()}</div>
<div class="card" style="margin-top:16px;background:linear-gradient(90deg,#2a2350,#123a3f)"><div class="row"><div><small style="color:var(--te)">RECOMMENDED NEXT LESSON</small><h3 style="margin:4px 0">${q.t}</h3><span class="mu">${q.x}</span></div><button class="btn" onclick="go('tutor')">Jump Into Tutor</button></div></div>`},
practice(){const list=Q.filter(q=>(!S.topic||q.tp==S.topic)&&(S.lv=='All'||q.lv==S.lv)&&(q.t+q.tp+q.d).toLowerCase().includes(S.q.toLowerCase()));
return `<div class="row"><div><h2 style="margin:0">Practice Library</h2><span class="mu">Select a topic or filter by difficulty.</span></div><span class="pill" style="color:var(--te)">Showing ${list.length} of ${Q.length} Questions</span></div>
<div class="row" style="margin:14px 0"><input type="search" style="flex:1;min-width:220px" placeholder="Search topics, questions, or concepts (e.g. Stack, LRU, Swap)..." value="${esc(S.q)}" oninput="S.q=this.value;redrawList()"><span>${['All','Beginner','Intermediate','Advanced'].map(l=>`<button class="pill ${S.lv==l?'on':''}" style="${S.lv==l?'background:#c4b5fd;color:#1a1033':''}" onclick="S.lv='${l}';go('practice')">${l}</button>`).join(' ')}</span></div>
<h3>Featured Topics</h3><div class="grid">${TOPICS.map(([n,d])=>`<div class="card tile ${S.topic==n?'on':''}" onclick="S.topic=S.topic=='${n}'?'':'${n}';go('practice')"><h3>${n}</h3><p class="mu">${d}</p><small class="mu">${Q.filter(q=>q.tp==n).length} problems · ${S.topic==n?'Filtered':'Filter'}</small></div>`).join('')}</div>
<div class="row" style="margin:16px 0 8px"><small class="mu">Topic: ${S.topic||'All'} · Difficulty: ${S.lv}</small><button class="btn2" onclick="S.topic='';S.lv='All';S.q='';go('practice')">↺ Reset</button></div><div id="list">${qlist(list)}</div>`},
tutor(){const q=cur();return `<div class="tut"><div class="card"><div class="row"><span><span class="lv ${q.lv}">${q.lv}</span> <span class="lv mu">${q.tp}</span></span><button class="btn2" onclick="mark(${q.id})">${S.marks.includes(q.id)?'★ Saved':'☆ Save'}</button></div>
<h2 style="margin-top:12px">${q.t}</h2><p class="mu">${q.d}</p><div class="grid"><div><small class="mu">SAMPLE INPUT</small><pre>${esc(q.i)}</pre></div><div><small class="mu">EXPECTED OUTPUT</small><pre>${esc(q.o)}</pre></div></div>
<details open class="card" style="background:#12202a"><summary>Conceptual Explanation</summary><p class="mu">${q.x}</p></details><br>
<textarea id="code" spellcheck="false">${esc(S.lang=='python'?q.s:`// ${LANGS[S.lang]}: ${q.t}\n// Write your solution here\n`)}</textarea>
<div class="row" style="margin:8px 0"><span class="mu">Edit and test custom inputs</span><button class="btn" style="background:linear-gradient(90deg,#22c55e,#4ade80)" onclick="run()">▶ Run Code</button></div>
<pre id="out" class="mu">[Ready to execute ${LANGS[S.lang].toUpperCase()}] Click "Run Code" to compile, test, and observe output.</pre>
<div class="row"><span><button class="btn2" onclick="ask('Explain this problem again in simpler terms, with an analogy.','↻ Explain again')">↻ Explain Again</button> <button class="btn2" onclick="ask('Give me one hint only, not the solution.','💡 Give hint')">💡 Give Hint</button></span><button class="btn" onclick="next()">Next Question →</button></div></div>
<div class="card"><div class="row"><b>CodePilot AI Tutor <small class="mu">· Gemini · ${esc(S.model)}</small></b><button class="btn2" onclick="S.chat[S.qid]=[];save();draw()">🗑</button></div>
<div class="chat" id="chat"></div><div class="in"><input id="msg" placeholder="Ask CodePilot anything about this question..." onkeydown="if(event.key=='Enter')send()"><button class="btn" onclick="send()">Send</button></div></div></div>`},
progress(){const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return[d.toLocaleDateString('en',{weekday:'short'}),S.days.includes(d.toISOString().slice(0,10))]});
const sk=TOPICS.map(([n])=>{const t=Q.filter(q=>q.tp==n),d=t.filter(q=>S.solved.includes(q.id)).length;return[n,Math.round(d/t.length*100)]});
const mk=Q.filter(q=>S.marks.includes(q.id));
return `<h1 style="font-size:34px">Your Coding Journey</h1><div class="grid">${stats()}</div>
<h2>Weekly activity</h2><div class="grid" style="grid-template-columns:repeat(7,1fr)">${days.map(([n,a])=>`<div class="day ${a?'a':''}">${n}<br>●<br><small>${a?'Active':'—'}</small></div>`).join('')}</div>
<h2>Skills & Competencies</h2><div class="grid">${sk.map(([n,p])=>`<div class="card"><b>${n}</b><span class="mu" style="float:right">${p}%</span><div class="bar"><i style="width:${p}%"></i></div></div>`).join('')}</div>
<h2>Saved & Bookmarked Questions</h2>${mk.map(q=>`<div class="card row" style="margin:8px 0"><span>${q.t} <span class="lv ${q.lv}">${q.lv}</span></span><span><button class="btn2" onclick="S.qid=${q.id};go('tutor')">▶ Review in Tutor</button> <button class="btn2" onclick="mark(${q.id});go('progress')">🗑</button></span></div>`).join('')||'<p class="mu">Bookmark a question in the tutor to see it here.</p>'}`}};
const stats=()=>{const p=Math.round(S.solved.length/Q.length*100);return `<div class="card"><small class="mu">Completed Lessons</small><h2 style="margin:4px 0">${S.done} <small class="mu">/ 24</small></h2><div class="bar"><i style="width:${S.done/24*100}%"></i></div></div>
<div class="card"><small class="mu">Problems Solved</small><h2 style="margin:4px 0">${S.solved.length} <small class="mu">/ ${Q.length}</small></h2><div class="bar"><i style="width:${p}%"></i></div></div>
<div class="card"><small class="mu">Current Streak</small><h2 style="margin:4px 0">${streak()} <small class="mu">days</small></h2></div>
<div class="card"><small class="mu">Concept Mastery</small><h2 style="margin:4px 0">${p}% <small class="mu">Proficient</small></h2><div class="bar"><i style="width:${p}%"></i></div></div>`};
const qlist=l=>l.map(q=>`<div class="card row" style="margin:8px 0"><div><b>${S.solved.includes(q.id)?'✅ ':''}${q.t}</b><br><small class="mu">${q.tp}</small></div><span><span class="lv ${q.lv}">${q.lv}</span> <button class="btn2" onclick="mark(${q.id});redrawList()">${S.marks.includes(q.id)?'★':'☆'}</button> <button class="btn2" onclick="S.qid=${q.id};go('tutor')">🤖 Solve with AI</button></span></div>`).join('')||'<p class="mu">No matches. Reset the filters.</p>';
function redrawList(){const l=Q.filter(q=>(!S.topic||q.tp==S.topic)&&(S.lv=='All'||q.lv==S.lv)&&(q.t+q.tp+q.d).toLowerCase().includes(S.q.toLowerCase()));$('#list').innerHTML=qlist(l)}
function mark(id){S.marks=S.marks.includes(id)?S.marks.filter(x=>x!=id):[...S.marks,id];save();if(S.tab=='tutor')go('tutor')}
function next(){const i=Q.findIndex(q=>q.id==S.qid);S.qid=Q[(i+1)%Q.length].id;go('tutor')}
function send(){const i=$('#msg'),t=i.value.trim();if(!t)return;i.value='';ask(t)}
function go(t){S.tab=t;save();$('#stk').textContent='🔥 '+streak()+' Days';
 $('#nav').innerHTML=[['home','Home'],['practice','Practice'],['tutor','AI Tutor'],['progress','Progress']].map(([k,l])=>`<button class="${t==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 $('#v').innerHTML=views[t]();if(t=='tutor')draw()}
go(S.tab);
</script></body></html>
